[project]
name = "bevor-protocol-genlayer"
version = "0.1.0"
description = "Bevor Protocol audit payment vesting and liability decisions on GenLayer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genlayer-py @ git+https://github.com/genlayerlabs/genlayer-py@v0.18",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "eth-account>=0.13.3",
    "eth-utils>=5.0.0",
]

[dependency-groups]
dev = [
    "genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite@v0.29",
    "genvm-linter @ git+https://github.com/genlayerlabs/genvm-linter@main",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring GenLayer Studio (run with gltest)",
]
